name: app-public-release-probe

on:
  push:
    branches:
      - ops/app-public-release-probe
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe live app safely
        shell: bash
        run: |
          set -euo pipefail
          ROOT='https://app.revealingmindai.org/'
          APP='https://app.revealingmindai.org/app'

          echo '=== DNS ==='
          python3 - <<'PY'
          import json, urllib.request
          for typ in ('CNAME','A','AAAA'):
              u=f'https://dns.google/resolve?name=app.revealingmindai.org&type={typ}'
              try:
                  data=json.load(urllib.request.urlopen(u, timeout=10))
                  ans=[x.get('data') for x in data.get('Answer', [])]
                  print(typ, ans)
              except Exception as e:
                  print(typ, 'ERROR', type(e).__name__)
          PY

          probe () {
            url="$1"
            label="$2"
            body="${label}.html"
            headers="${label}.headers"
            echo "=== ${label} STATUS+HEADERS ==="
            curl -sS -L --max-time 20 -D "$headers" -o "$body" "$url"
            awk 'BEGIN{IGNORECASE=1} /^HTTP\// || /^server:/ || /^via:/ || /^x-powered-by:/ || /^cf-ray:/ || /^x-vercel-id:/ || /^x-render-origin-server:/ || /^location:/ || /^content-type:/ || /^content-length:/ {print}' "$headers"
            echo "BODY_BYTES $(wc -c < "$body")"
            echo "BODY_SHA256 $(sha256sum "$body" | awk '{print $1}')"
            python3 - "$body" <<'PY'
          import re, sys
          from html import unescape
          p=sys.argv[1]
          s=open(p,'r',encoding='utf-8',errors='ignore').read()
          def vals(pattern):
              return [unescape(x) for x in re.findall(pattern,s,re.I|re.S)]
          titles=vals(r'<title[^>]*>(.*?)</title>')[:3]
          scripts=vals(r'<script[^>]+src=["\']([^"\']+)')[:30]
          forms=vals(r'<form[^>]+action=["\']([^"\']+)')[:20]
          links=vals(r'<a[^>]+href=["\']([^"\']+)')[:40]
          print('TITLES', titles)
          print('SCRIPT_SRCS', scripts)
          print('FORM_ACTIONS', forms)
          print('LINKS_SAMPLE', links)
          for needle in ('invite only','private beta','demo@revealingmind.ai','ClawOS','CadenceOps','Sign in','Log in','Create account','Get started'):
              print('HAS_'+re.sub(r'[^A-Za-z0-9]+','_',needle).upper(), needle.lower() in s.lower())
          PY
          }

          probe "$ROOT" root
          probe "$APP" app
